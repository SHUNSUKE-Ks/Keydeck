<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeyDeck — DevStudio</title>
  <style>
    :root {
      --bg:       #0b0e16;
      --panel:   #131826;
      --panel-2: #1a2030;
      --border:  #232a3d;
      --text:    #e5e7eb;
      --muted:   #8b93a7;
      --accent:  #3b82f6;
      --todo:    #6b7280;
      --wip:     #f59e0b;
      --review:  #8b5cf6;
      --done:    #22c55e;
      --p1:      #ef4444;
      --p2:      #f59e0b;
      --p3:      #6b7280;
      --server:  #38bdf8;
      --app:     #a78bfa;
      --shared:  #f472b6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    body { padding: 24px; max-width: 1400px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 { font-size: 22px; font-weight: 600; }
    h1 .project { color: var(--accent); }
    .meta { color: var(--muted); font-size: 12px; }

    /* ====== Dashboard ====== */
    .dashboard {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .dashboard h2 {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }
    .next-up {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .next-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      border-left: 4px solid var(--accent);
    }
    .next-card .id {
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      margin-bottom: 4px;
    }
    .next-card .title { font-weight: 600; margin-bottom: 8px; }
    .next-card .meta-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .next-card.blocked { border-left-color: var(--muted); opacity: 0.6; }
    .next-card.blocked .id::after {
      content: " · 依存待ち";
      color: var(--muted);
    }
    .empty-next {
      color: var(--muted);
      font-style: italic;
      padding: 12px;
    }

    .progress-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .progress-block { flex: 1; min-width: 200px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .progress-label .name { color: var(--text); font-weight: 500; }
    .progress-label .count { color: var(--muted); font-family: ui-monospace, monospace; }
    .bar {
      height: 8px;
      background: var(--panel-2);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }
    .bar-seg {
      height: 100%;
      transition: width 0.3s;
    }
    .bar-seg.done     { background: var(--done); }
    .bar-seg.review   { background: var(--review); }
    .bar-seg.in_progress { background: var(--wip); }
    .bar-seg.todo     { background: var(--todo); }

    /* ====== Kanban ====== */
    .kanban {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    @media (max-width: 1000px) {
      .kanban { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .kanban { grid-template-columns: 1fr; }
    }
    .column {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      min-height: 200px;
    }
    .column-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .column-title { font-size: 13px; font-weight: 600; }
    .column-count {
      font-size: 11px;
      color: var(--muted);
      background: var(--panel-2);
      padding: 2px 8px;
      border-radius: 10px;
      font-family: ui-monospace, monospace;
    }
    .column.todo .column-title       { color: var(--todo); }
    .column.in_progress .column-title{ color: var(--wip); }
    .column.review .column-title     { color: var(--review); }
    .column.done .column-title       { color: var(--done); }

    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.05s;
    }
    .card:hover { border-color: var(--accent); }
    .card:active { transform: scale(0.99); }
    .card .id {
      font-size: 10px;
      color: var(--muted);
      font-family: ui-monospace, monospace;
      margin-bottom: 4px;
    }
    .card .title { font-size: 13px; line-height: 1.4; margin-bottom: 8px; }
    .card .badges { display: flex; gap: 4px; flex-wrap: wrap; }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 500;
      font-family: ui-monospace, monospace;
    }
    .badge.p1     { background: rgba(239,68,68,0.15); color: var(--p1); }
    .badge.p2     { background: rgba(245,158,11,0.15); color: var(--p2); }
    .badge.p3     { background: rgba(107,114,128,0.15); color: var(--p3); }
    .badge.server { background: rgba(56,189,248,0.15); color: var(--server); }
    .badge.app    { background: rgba(167,139,250,0.15); color: var(--app); }
    .badge.shared { background: rgba(244,114,182,0.15); color: var(--shared); }

    /* ====== Detail modal ====== */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 640px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
    }
    .modal h3 { font-size: 18px; margin-bottom: 4px; }
    .modal .modal-id {
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, monospace;
      margin-bottom: 16px;
    }
    .modal h4 {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 16px 0 6px;
      font-weight: 500;
    }
    .modal ul { list-style: none; padding-left: 0; }
    .modal li {
      padding: 4px 0;
      font-size: 13px;
      font-family: ui-monospace, monospace;
      color: var(--text);
    }
    .modal li:before {
      content: "›";
      color: var(--muted);
      margin-right: 8px;
    }
    .modal .acc-list li:before { content: "✓"; color: var(--done); }
    .modal-close {
      position: sticky; top: 0;
      float: right;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .modal-close:hover { color: var(--text); border-color: var(--accent); }

    .footnote {
      margin-top: 24px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }
    code {
      font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      background: var(--panel-2);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <h1>
      <span class="project" id="project-name">KeyDeck</span>
      <span style="color: var(--muted); font-weight: 400;"> — DevStudio</span>
    </h1>
    <div class="meta" id="meta-line"></div>
  </header>

  <!-- ====== Dashboard (Next-up + Progress) ====== -->
  <section class="dashboard">
    <h2>次にやること (依存解決済みの未着手)</h2>
    <div class="next-up" id="next-up"></div>

    <h2 style="margin-top: 8px;">進捗</h2>
    <div class="progress-row" id="progress"></div>
  </section>

  <!-- ====== Kanban ====== -->
  <section class="kanban" id="kanban"></section>

  <p class="footnote">
    チケット編集: <code>tickets.js</code> · このページ: <code>index.html</code> ·
    ダブルクリック起動 OK (サーバ不要)
  </p>

  <!-- ====== Modal ====== -->
  <div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal"></div>
  </div>

  <script src="tickets.js"></script>
  <script>
    "use strict";

    // ---------- ラベル / カラム定義 ----------
    const STATUSES = ["todo", "in_progress", "review", "done"];
    const STATUS_LABEL = {
      todo: "TODO",
      in_progress: "進行中",
      review: "レビュー",
      done: "完了",
    };

    // ---------- ユーティリティ ----------
    const $ = (sel) => document.querySelector(sel);
    const el = (tag, attrs = {}, children = []) => {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") node.className = v;
        else if (k === "onclick") node.onclick = v;
        else node.setAttribute(k, v);
      }
      const kids = Array.isArray(children) ? children : [children];
      for (const c of kids) {
        if (c == null) continue;
        node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
      }
      return node;
    };

    // ---------- データ取得 ----------
    const DATA = window.TICKETS;
    if (!DATA) {
      document.body.innerHTML =
        '<p style="color:#ef4444;padding:40px;">tickets.js が読み込めません。同じフォルダにありますか?</p>';
      throw new Error("tickets.js not loaded");
    }
    const tickets = DATA.tickets;
    const byId = Object.fromEntries(tickets.map((t) => [t.id, t]));

    // 依存解決済み = depends_on の全チケットが done
    const isUnblocked = (t) =>
      (t.depends_on || []).every((dep) => byId[dep] && byId[dep].status === "done");

    // ---------- ヘッダ ----------
    $("#project-name").textContent = DATA.project;
    $("#meta-line").textContent =
      `Phase ${DATA.phase} · ${DATA.generated_at} · 全 ${tickets.length} チケット`;

    // ---------- 次にやること ----------
    function renderNextUp() {
      const container = $("#next-up");
      container.innerHTML = "";

      // priority (P1 > P2 > P3) → id 順 で並べた未完了
      const prioRank = { P1: 0, P2: 1, P3: 2 };
      const pending = tickets
        .filter((t) => t.status !== "done")
        .sort((a, b) => {
          const pa = prioRank[a.priority] ?? 9;
          const pb = prioRank[b.priority] ?? 9;
          if (pa !== pb) return pa - pb;
          return a.id.localeCompare(b.id);
        });

      // 進行中 → 依存解決済み TODO → 依存待ち の順で最大 6 件
      const inProgress = pending.filter((t) => t.status === "in_progress");
      const ready = pending.filter((t) => t.status === "todo" && isUnblocked(t));
      const blocked = pending.filter((t) => t.status === "todo" && !isUnblocked(t));

      const picked = [...inProgress, ...ready, ...blocked].slice(0, 6);

      if (picked.length === 0) {
        container.appendChild(
          el("p", { class: "empty-next" }, "🎉 全チケット完了!")
        );
        return;
      }

      for (const t of picked) {
        const blockedNow = t.status === "todo" && !isUnblocked(t);
        const card = el("div", {
          class: "next-card" + (blockedNow ? " blocked" : ""),
          onclick: () => openModal(t.id),
        }, [
          el("div", { class: "id" }, t.id),
          el("div", { class: "title" }, t.title),
          el("div", { class: "meta-row" }, [
            el("span", { class: "badge " + t.priority.toLowerCase() }, t.priority),
            el("span", { class: "badge " + t.area }, t.area),
          ]),
        ]);
        container.appendChild(card);
      }
    }

    // ---------- 進捗バー ----------
    function renderProgress() {
      const container = $("#progress");
      container.innerHTML = "";

      const groups = {
        全体: tickets,
        P1: tickets.filter((t) => t.priority === "P1"),
        P2: tickets.filter((t) => t.priority === "P2"),
        P3: tickets.filter((t) => t.priority === "P3"),
      };

      for (const [name, list] of Object.entries(groups)) {
        const counts = { todo: 0, in_progress: 0, review: 0, done: 0 };
        for (const t of list) counts[t.status]++;
        const total = list.length || 1;
        const block = el("div", { class: "progress-block" }, [
          el("div", { class: "progress-label" }, [
            el("span", { class: "name" }, name),
            el("span", { class: "count" }, `${counts.done} / ${list.length}`),
          ]),
          el("div", { class: "bar" }, STATUSES.map((s) => {
            const w = (counts[s] / total) * 100;
            return el("div", {
              class: "bar-seg " + s,
              style: `width:${w}%`,
              title: `${STATUS_LABEL[s]}: ${counts[s]}`,
            });
          })),
        ]);
        container.appendChild(block);
      }
    }

    // ---------- カンバン ----------
    function renderKanban() {
      const container = $("#kanban");
      container.innerHTML = "";

      const prioRank = { P1: 0, P2: 1, P3: 2 };
      for (const status of STATUSES) {
        const items = tickets
          .filter((t) => t.status === status)
          .sort((a, b) => {
            const pa = prioRank[a.priority] ?? 9;
            const pb = prioRank[b.priority] ?? 9;
            if (pa !== pb) return pa - pb;
            return a.id.localeCompare(b.id);
          });

        const column = el("div", { class: "column " + status }, [
          el("div", { class: "column-header" }, [
            el("span", { class: "column-title" }, STATUS_LABEL[status]),
            el("span", { class: "column-count" }, String(items.length)),
          ]),
          ...items.map((t) => el("div", {
            class: "card",
            onclick: () => openModal(t.id),
          }, [
            el("div", { class: "id" }, t.id),
            el("div", { class: "title" }, t.title),
            el("div", { class: "badges" }, [
              el("span", { class: "badge " + t.priority.toLowerCase() }, t.priority),
              el("span", { class: "badge " + t.area }, t.area),
            ]),
          ])),
        ]);
        container.appendChild(column);
      }
    }

    // ---------- 詳細モーダル ----------
    function openModal(id) {
      const t = byId[id];
      if (!t) return;
      const modal = $("#modal");
      modal.innerHTML = "";

      modal.appendChild(el("button", {
        class: "modal-close",
        onclick: closeModal,
      }, "× 閉じる"));
      modal.appendChild(el("h3", {}, t.title));
      modal.appendChild(el("div", { class: "modal-id" },
        `${t.id} · ${t.priority} · ${t.area} · ${STATUS_LABEL[t.status]}`));

      if (t.files && t.files.length) {
        modal.appendChild(el("h4", {}, "対象ファイル"));
        modal.appendChild(el("ul", {},
          t.files.map((f) => el("li", {}, f))));
      }
      if (t.depends_on && t.depends_on.length) {
        modal.appendChild(el("h4", {}, "依存"));
        modal.appendChild(el("ul", {},
          t.depends_on.map((d) => {
            const dep = byId[d];
            const status = dep ? STATUS_LABEL[dep.status] : "?";
            return el("li", {}, `${d} (${status})`);
          })));
      }
      if (t.scaffold_anchors && t.scaffold_anchors.length) {
        modal.appendChild(el("h4", {}, "スキャフォールドアンカー"));
        modal.appendChild(el("ul", {},
          t.scaffold_anchors.map((a) => el("li", {}, a))));
      }
      if (t.acceptance && t.acceptance.length) {
        modal.appendChild(el("h4", {}, "受け入れ条件"));
        modal.appendChild(el("ul", { class: "acc-list" },
          t.acceptance.map((a) => el("li", {}, a))));
      }

      $("#modal-backdrop").classList.add("open");
    }
    function closeModal() {
      $("#modal-backdrop").classList.remove("open");
    }
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    // ---------- 初回描画 ----------
    renderNextUp();
    renderProgress();
    renderKanban();
  </script>
</body>
</html>
